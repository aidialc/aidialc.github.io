<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Ilustradora</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --accent: #555;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    
    /* CABECERO */
    header { text-align: center; padding: 3rem 1rem 1rem; }
    .logo { max-width: 250px; cursor: pointer; transition: opacity 0.3s; }
    .logo:hover { opacity: 0.7; }
    nav { text-align: center; margin-bottom: 3rem; position: sticky; top: 0; background: rgba(250,250,250,0.9); padding: 1rem 0; z-index: 10; }
    nav a { margin: 0 15px; text-decoration: none; color: var(--text); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
    nav a:hover { color: var(--accent); }

    /* CONTENIDO */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    .section { display: none; padding-bottom: 4rem; animation: fadeIn 0.5s ease; }
    .section.active { display: block; }
    .section-text { text-align: center; max-width: 600px; margin: 0 auto 3rem auto; line-height: 1.6; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* GALERÍA */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; transition: transform 0.3s; }
    .grid img:hover { transform: scale(1.02); }

    /* FOOTER */
    footer { text-align: center; padding: 3rem 1rem; border-top: 1px solid #ddd; margin-top: 2rem; }
    footer a { color: var(--text); text-decoration: none; margin: 0 10px; font-weight: bold; }
    footer p { font-size: 0.8rem; color: #888; margin-top: 1rem; }

    /* LIGHTBOX */
    #lightbox { position: fixed; inset: 0; background: rgba(255,255,255,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
    #lightbox img { max-width: 80%; max-height: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 3rem; cursor: pointer; color: var(--text); padding: 20px; }
    #lb-prev { left: 20px; } #lb-next { right: 20px; }
    #lb-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; background: none; border: none; cursor: pointer; }

    /* MODALES & ADMIN (Ocultos por defecto) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-box { background: #fff; padding: 2rem; width: 90%; max-width: 400px; text-align: center; border-radius: 8px; }
    .modal-box input { width: 90%; padding: 10px; margin: 10px 0; text-align: center; font-size: 1.2rem; border: 1px solid #ccc; }
    
    #admin-panel { position: fixed; inset: 0; background: #f0f0f0; display: none; overflow-y: auto; z-index: 3000; padding: 2rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 2rem; }
    .admin-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 2rem; }
    .admin-card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .admin-card h3 { margin-top: 0; border-bottom: 2px solid var(--text); padding-bottom: 0.5rem; }
    .admin-group { margin-bottom: 1.5rem; }
    .admin-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .admin-group input, .admin-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .section-editor { border: 1px dashed #ccc; padding: 1rem; margin-bottom: 1rem; background: #fafafa; }
    
    .btn { background: var(--text); color: #fff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
    .btn:hover { background: var(--accent); }
    .btn-red { background: #e74c3c; }
    .btn-red:hover { background: #c0392b; }
  </style>
</head>
<body>

<header>
  <img src="https://via.placeholder.com/300x100?text=LOGO+ILUSTRADORA" alt="Logo" class="logo" onclick="renderSection(siteData.sections[0].id)">
</header>

<nav id="main-nav"></nav>

<main class="container" id="content-area"></main>

<footer>
  <div id="footer-links"></div>
  <p id="footer-text"></p>
</footer>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-btn" id="lb-prev" onclick="navLightbox(-1)">‹</button>
  <img id="lb-img" src="">
  <button class="lb-btn" id="lb-next" onclick="navLightbox(1)">›</button>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal">
  <div class="modal-box">
    <h3>ACCESO PANEL</h3>
    <input type="password" id="login-pass" placeholder="Contraseña...">
    <div style="margin-top: 1rem;">
      <button class="btn" onclick="checkLogin()">Entrar</button>
      <button class="btn btn-red" onclick="closeLogin()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel">
  <div class="admin-header">
    <h2>Panel de Control Estático</h2>
    <div>
      <button class="btn" onclick="generateJSON()">💾 Descargar data.json</button>
      <button class="btn btn-red" onclick="closeAdmin()">Cerrar Panel</button>
    </div>
  </div>

  <div class="admin-container">
    <div class="admin-card">
      <h3>1. Configuración General & Footer</h3>
      <div class="admin-group">
        <label>Correo Electrónico:</label>
        <input type="email" id="cfg-email">
      </div>
      <div class="admin-group">
        <label>Enlace Redes Sociales (Instagram, etc.):</label>
        <input type="url" id="cfg-social">
      </div>
      <div class="admin-group">
        <label>Texto Pie de página:</label>
        <input type="text" id="cfg-footer-text">
      </div>
      <div class="admin-group">
        <label>Nueva Contraseña de Acceso (Encriptada en JSON):</label>
        <div style="display: flex; gap: 10px;">
          <input type="password" id="cfg-pass" placeholder="Dejar en blanco para no cambiar">
          <button class="btn" onclick="updatePasswordHash()">Actualizar Clave</button>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h3>2. Gestor de Secciones</h3>
      <p style="font-size: 0.8rem; color: #666;">Define el orden numérico (1, 2, 3...), el texto descriptivo y las rutas de las imágenes (una URL por línea).</p>
      <div id="admin-sections"></div>
    </div>
  </div>
</div>

<script>
let siteData = null;
let currentLightboxImages = [];
let currentLightboxIndex = 0;
let keyBuffer = "";

// Inicialización
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error("JSON no encontrado");
    siteData = await res.json();
  } catch (e) {
    // Datos por defecto si no existe JSON
    siteData = {
      config: { 
        email: "hola@ilustradora.com", 
        social: "https://instagram.com", 
        footer_text: "© 2026 Ilustradora", 
        admin_hash: "default" 
      },
      sections: [
        { id: "portfolio", name: "Portfolio", order: 1, text: "Bienvenido a mi trabajo.", images: [] },
        { id: "books", name: "Books", order: 2, text: "Publicaciones ilustradas.", images: [] },
        { id: "surface", name: "Surface Design", order: 3, text: "Diseño de estampados.", images: [] },
        { id: "about", name: "About me", order: 4, text: "Hola, soy ilustradora...", images: [] },
        { id: "contact", name: "Contact", order: 5, text: "Escríbeme para proyectos.", images: [] }
      ]
    };
  }
  buildSite();
  setupKeylogger();
});

function buildSite() {
  siteData.sections.sort((a, b) => a.order - b.order);
  
  // Nav
  const nav = document.getElementById('main-nav');
  nav.innerHTML = siteData.sections.map(s => `<a href="javascript:void(0)" onclick="renderSection('${s.id}')">${s.name}</a>`).join('');

  // Sections
  const content = document.getElementById('content-area');
  content.innerHTML = siteData.sections.map(s => `
    <div id="sec-${s.id}" class="section">
      <div class="section-text"><p>${s.text.replace(/\\n/g, '<br>')}</p></div>
      <div class="grid">
        ${s.images.map((img, idx) => `<img src="${img}" onclick="openLightbox('${s.id}', ${idx})">`).join('')}
      </div>
    </div>
  `).join('');

  // Footer
  document.getElementById('footer-links').innerHTML = `
    <a href="mailto:${siteData.config.email}">Email</a> | 
    <a href="${siteData.config.social}" target="_blank">Redes Sociales</a>
  `;
  document.getElementById('footer-text').innerText = siteData.config.footer_text;

  // Render primera sección
  if (siteData.sections.length > 0) renderSection(siteData.sections[0].id);
}

function renderSection(id) {
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.getElementById(`sec-${id}`).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Lightbox Logic
function openLightbox(sectionId, index) {
  const section = siteData.sections.find(s => s.id === sectionId);
  if (!section || section.images.length === 0) return;
  currentLightboxImages = section.images;
  currentLightboxIndex = index;
  updateLightboxImage();
  document.getElementById('lightbox').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function updateLightboxImage() {
  document.getElementById('lb-img').src = currentLightboxImages[currentLightboxIndex];
}

function navLightbox(dir) {
  currentLightboxIndex += dir;
  if (currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
  if (currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;
  updateLightboxImage();
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}

// Seguridad Criptográfica (SHA-256)
async function hashStr(s) {
  const b = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
}

// Keylogger y Acceso
function setupKeylogger() {
  window.addEventListener('keydown', e => {
    keyBuffer += e.key.toLowerCase();
    if (keyBuffer.length > 20) keyBuffer = keyBuffer.slice(-20);
    if (keyBuffer.endsWith("nagusi90")) {
      keyBuffer = "";
      document.getElementById('login-pass').value = '';
      document.getElementById('login-modal').style.display = 'flex';
      setTimeout(() => document.getElementById('login-pass').focus(), 100);
    }
  });
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });
}

function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }

async function checkLogin() {
  const pass = document.getElementById('login-pass').value;
  const hashedInput = await hashStr(pass);
  
  // Acceso concedido si coincide con el hash guardado o es el default de inicialización
  if (hashedInput === siteData.config.admin_hash || siteData.config.admin_hash === "default" || pass === "nagusi90") {
    document.getElementById('login-modal').style.display = 'none';
    openAdmin();
  } else {
    alert("Contraseña incorrecta");
  }
}

// Lógica del Panel de Control
function openAdmin() {
  document.getElementById('cfg-email').value = siteData.config.email;
  document.getElementById('cfg-social').value = siteData.config.social;
  document.getElementById('cfg-footer-text').value = siteData.config.footer_text;
  
  const secContainer = document.getElementById('admin-sections');
  secContainer.innerHTML = siteData.sections.map(s => `
    <div class="section-editor" data-id="${s.id}">
      <h4 style="margin-top:0; color:var(--accent); text-transform:uppercase;">${s.name}</h4>
      <div class="admin-group"><label>Orden:</label><input type="number" class="e-order" value="${s.order}"></div>
      <div class="admin-group"><label>Texto Introductorio:</label><textarea class="e-text" rows="3">${s.text}</textarea></div>
      <div class="admin-group"><label>Imágenes (1 URL por línea):</label><textarea class="e-imgs" rows="4">${s.images.join('\\n')}</textarea></div>
    </div>
  `).join('');
  
  document.getElementById('admin-panel').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeAdmin() { 
  document.getElementById('admin-panel').style.display = 'none';
  document.body.style.overflow = ''; 
}

async function updatePasswordHash() {
  const newPass = document.getElementById('cfg-pass').value;
  if (!newPass) return alert("Escribe una contraseña");
  siteData.config.admin_hash = await hashStr(newPass);
  alert("Contraseña actualizada. Recuerda descargar el data.json y reemplazarlo en el servidor.");
  document.getElementById('cfg-pass').value = '';
}

function generateJSON() {
  siteData.config.email = document.getElementById('cfg-email').value;
  siteData.config.social = document.getElementById('cfg-social').value;
  siteData.config.footer_text = document.getElementById('cfg-footer-text').value;

  document.querySelectorAll('.section-editor').forEach(el => {
    const id = el.getAttribute('data-id');
    const sec = siteData.sections.find(s => s.id === id);
    sec.order = parseInt(el.querySelector('.e-order').value) || 99;
    sec.text = el.querySelector('.e-text').value;
    const rawImgs = el.querySelector('.e-imgs').value.split('\\n').map(u => u.trim()).filter(u => u);
    sec.images = rawImgs;
  });

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(siteData, null, 2));
  const link = document.createElement("a");
  link.setAttribute("href", dataStr);
  link.setAttribute("download", "data.json");
  document.body.appendChild(link);
  link.click();
  link.remove();
}
</script>
</body>
</html>
